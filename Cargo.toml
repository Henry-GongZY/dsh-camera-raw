[workspace]
resolver = "2"
members = [
    "crates/dsh-cr-core",
    "crates/dsh-cr-plugin",
    "crates/dsh-cr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
